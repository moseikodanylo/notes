</style></head><body>
<div id="app"><div id="main"></div>
<nav><button id="n1" onclick="tab('home')">🏠 Домівка</button><button id="n2" onclick="tab('set')">⚙️ Налаштування</button></nav></div>
<button id="fab">＋</button><div id="m"></div><div id="sb"></div><div id="eb" onmousedown="event.preventDefault()"></div><div id="cv">📒</div><div id="lk"></div><div id="tst" onclick="this.style.display='none'"></div>
<script>
let DB={cats:[],brs:[],notes:[],tags:[]},S={v:"home",id:null,cal:"month",d:new Date(),sort:{},q:""},stack=[],H,lastR,ED,SEL=null,lp,lpd,PIN_B="",PIN_OK,PIN_CB,hid=0;
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36),now=()=>Date.now();
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fdt=t=>new Date(t).toLocaleString(LC(),{dateStyle:"short",timeStyle:"short"}),ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const evTs=e=>new Date(e.date+"T"+(e.time||"00:00")).getTime(),evK=n=>n.events.length?Math.min(...n.events.map(evTs)):9e15;
const mk=o=>Object.assign({id:uid(),created:now(),edited:now()},o),G=(a,id)=>DB[a].find(x=>x.id==id);
var SH={get c(){return !!S.hv},b:0,n:0};const CH=x=>(DB.cats.find(y=>y.id==x.cat)||{}).hide,NV=x=>{const b=DB.brs.find(y=>y.id==x.br)||{};return(SH.b||!b.hide)&&(SH.c||!CH(b))};
const cats=()=>DB.cats.filter(x=>!x.del&&(SH.c||!x.hide)),brs=c=>DB.brs.filter(x=>!x.del&&(!c||x.cat==c)&&(SH.b||!x.hide)&&(SH.c||!CH(x))),notes=b=>DB.notes.filter(x=>!x.del&&(!b||x.br==b)&&(SH.n||!x.hide)&&NV(x));
const brOf=n=>G("brs",n.br),catOf=b=>b&&G("cats",b.cat),cur=()=>G("notes",S.id);
// ---------- storage (IndexedDB, autosave) ----------
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open("notesdb",1);r.onupgradeneeded=()=>r.result.createObjectStore("k");r.onsuccess=()=>res(r.result);r.onerror=()=>rej()}catch(e){rej(e)}})}
async function load(){try{H=await idb();return await new Promise(r=>{const q=H.transaction("k").objectStore("k").get("db");q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}catch(e){return null}}
let tm;function save(){clearTimeout(tm);tm=setTimeout(flush,250)}
function flush(){clearTimeout(tm);try{H&&H.transaction("k","readwrite").objectStore("k").put(DB,"db")}catch(e){}}
addEventListener("pagehide",flush);document.addEventListener("visibilitychange",()=>{if(document.hidden)flush()});
function inbox(){DB.pin=DB.pin||"0000";if(DB.pinOn===undefined)DB.pinOn=true;let c=DB.cats.find(x=>x.inbox&&!x.del);if(!c){c=mk({name:"Вхідні",desc:"Швидкі нотатки",inbox:1});DB.cats.push(c)}let b=DB.brs.find(x=>x.cat==c.id&&!x.del);if(!b){b=mk({cat:c.id,name:"Загальне",desc:""});DB.brs.push(b)}return b.id}
// ---------- UI helpers ----------
function show(h){const m=$("#m");m.innerHTML='<div class="box">'+h+'</div>';m.style.display="flex"}function cl(){$("#m").style.display="none"}
function ask(t,f,cb,extra){show(`<h3>${t}</h3>${f.map((x,i)=>`<label>${x[0]}</label>`+(x[2]=="area"?`<textarea id="f${i}">${esc(x[1])}</textarea>`:`<input id="f${i}" type="${x[2]||"text"}" value="${esc(x[1])}">`)).join("")}${extra||""}<div class="bt"><button onclick="cl()">Скасувати</button><button class="pri" id="ok">OK</button></div>`);$("#ok").onclick=()=>{const v=f.map((_,i)=>$("#f"+i).value);cl();cb(v)};const a=$("#f0");if(a&&!a.value)a.focus()}
function toast(t){const e=$("#tst");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",9000)}
function bar(t,r){return`<div class="bar">${stack.length?'<button onclick="back()">←</button>':""}<h2>${esc(t)}</h2>${r||""}</div>`}
const SORTS={nd:"Нові спочатку",od:"Старі спочатку",ed:"За редагуванням",az:"А–Я",za:"Я–А",ev:"За датою події",man:"Вручну"};
const sk=k=>S.sort[k]||(k=="n"?"nd":"od");
const sortSel=k=>`<select onchange="S.sort['${k}']=this.value;R()">${Object.entries(SORTS).filter(([x])=>k=="n"||x!="ev").map(([x,l])=>`<option value="${x}" ${x==sk(k)?"selected":""}>${l}</option>`).join("")}</select>`;
function sortBy(a,k){const f={nd:(x,y)=>y.created-x.created,od:(x,y)=>x.created-y.created,ed:(x,y)=>y.edited-x.edited,az:(x,y)=>x.name.localeCompare(y.name,"uk"),za:(x,y)=>y.name.localeCompare(x.name,"uk"),ev:(x,y)=>evK(x)-evK(y),man:(x,y)=>(x.ord??x.created)-(y.ord??y.created)};return[...a].sort(f[sk(k)])}
function nav(v,id){SEL=null;flush();stack.push([S.v,S.id]);S.v=v;S.id=id;S.q="";R();$("#main").scrollTop=0}
function back(){SEL=null;const p=stack.pop();if(p){S.v=p[0];S.id=p[1]}else S.v="home";R()}
function tab(v){SEL=null;stack=[];S.v=v;S.q="";R();$("#main").scrollTop=0}
const noteRow0=(n,a)=>{const b=brOf(n),c=catOf(b);return`<div class="row" ${RA("notes",n)} onclick="nav('note','${n.id}')"><b>${a==="n"?arr("notes",n.id,"n"):""}${n.pinned?"📌 ":""}${esc(n.name||"Без назви")}</b><small>${esc(c&&c.name)} › ${esc(b&&b.name)} · ${fdt(n.edited)}</small>${n.sub?`<small>${esc(n.sub)}</small>`:""}${n.tags.length?`<small>${n.tags.map(t=>"#"+esc(t)).join(" ")}</small>`:""}</div>`};
const plain=h=>{const d=document.createElement("div");d.innerHTML=h;return d.textContent};
// ---------- search ----------
function search(q,sc){q=q.trim().toLowerCase();if(!q)return[];return notes().filter(n=>{const b=brOf(n),c=catOf(b);if(sc&&sc.t=="c"&&(!c||c.id!=sc.id))return false;if(sc&&sc.t=="b"&&(!b||b.id!=sc.id))return false;
return[n.name,n.sub,plain(n.html),b&&b.name,c&&c.name,...n.tags,...n.events.map(e=>e.title+" "+(e.desc||"")),...n.stamps.map(s=>s.text)].join(" ").toLowerCase().includes(q)})}
function srRes(q,sc){const l=q.trim().toLowerCase();let h="";
if(!sc)h+=cats().filter(c=>c.name.toLowerCase().includes(l)).map(c=>`<div class="row" onclick="nav('cat','${c.id}')">📁 ${esc(c.name)}</div>`).join("");
if(!sc||sc.t=="c")h+=brs(sc?sc.id:0).filter(b=>b.name.toLowerCase().includes(l)).map(b=>`<div class="row" onclick="nav('br','${b.id}')">🌿 ${esc(b.name)}</div>`).join("");
const r=search(q,sc);return h+(r.map(noteRow).join("")||(h?"":'<p class="mut">Нічого не знайдено</p>'))}
function lq(v,t,id){S.q=v;$("#sr").innerHTML=v.trim()?srRes(v,t?{t,id}:null):"";$("#hb").style.display=v.trim()?"none":"";renderSel()}
// ---------- views ----------
function R(){const v=S.v;if(["cat","br","note"].includes(v)){const x=G(v=="cat"?"cats":v=="br"?"brs":"notes",S.id);if(!x||x.del){S.v="home";stack=[]}}
const V={home:vHome,cat:vCat,br:vBr,note:vNote,day:vDay,trash:vTrash,set:vSet,tag:vTag,hid:vHid};$("#main").innerHTML=V[S.v]();
$("#n1").className=S.v!="set"?"on":"";$("#n2").className=S.v=="set"?"on":"";$("#fab").style.display=["home","cat","br"].includes(S.v)?"":"none";
if(S.v=="note")bindNote();if(S.q&&$("#sr"))lq(S.q,S.v=="cat"?"c":S.v=="br"?"b":null,S.id);renderSel()}
function vHome(){return`<input class="s" placeholder="Пошук по всьому застосунку…" value="${esc(S.q)}" oninput="lq(this.value,null)"><div id="sr"></div><div id="hb">${hb()}</div>`}
function hb(){const p=notes().filter(n=>n.pinned),tg=[...new Set(notes().flatMap(n=>n.tags))],tc=DB.cats.filter(x=>x.del&&!x.via).length+DB.brs.filter(x=>x.del&&!x.via).length+DB.notes.filter(x=>x.del&&!x.via).length;
return cal()+(p.length?"<h3>📌 Закріплені</h3>"+p.map(noteRow).join(""):"")+(tg.length?`<h3>Теги</h3><div class="chips">${tg.map(t=>`<span class="chip" onclick="nav('tag','${esc(t)}')">#${esc(t)}</span>`).join("")}</div>`:"")+
`<div class="hd"><h3>Категорії</h3>${sortSel("c")}</div>`+sortBy(cats().filter(c=>!c.hide),"c").map(c=>`<div class="row" ${RA("cats",c)} onclick="nav('cat','${c.id}')"><b>${arr("cats",c.id,"c")}${ic(c)}${esc(c.name)}</b><small>${brs(c.id).length} гілок · ${DB.notes.filter(n=>!n.del&&brs(c.id).some(b=>b.id==n.br)).length} нотаток</small>${c.desc?`<small>${esc(c.desc)}</small>`:""}</div>`).join("")+`<div class="row" onclick="nav('trash')">🗑 Кошик (${tc})</div>${S.hv?`<div class="row" onclick="nav('hid')">🙈 Приховані категорії (${cats().filter(c=>c.hide).length})</div>`:""}`}
function cal(){const d=S.d,m=S.cal=="month",days=[];let st;
if(m){const f=new Date(d.getFullYear(),d.getMonth(),1);st=new Date(f);st.setDate(1-((f.getDay()+6)%7))}else{st=new Date(d);st.setDate(d.getDate()-((d.getDay()+6)%7))}
for(let i=0;i<(m?42:7);i++)days.push(new Date(st.getFullYear(),st.getMonth(),st.getDate()+i));
const ix={};const A=(k,t)=>{(ix[k]=ix[k]||{p:0,a:0,c:0})[t]++};
notes().forEach(n=>{n.events.forEach(e=>A(e.date,e.type=="plan"?"p":"a"));n.stamps.forEach(s=>A(ymd(new Date(s.ts)),"a"));A(ymd(new Date(n.created)),"c")});
const T=ymd(new Date()),ttl=m?d.toLocaleDateString(LC(),{month:"long",year:"numeric"}):days[0].toLocaleDateString(LC(),{day:"numeric",month:"short"})+" – "+days[6].toLocaleDateString(LC(),{day:"numeric",month:"short"});
return`<div class="cal"><div class="hd"><button onclick="cm(-1)">‹</button><b style="flex:1;text-align:center">${ttl}</b><button onclick="cm(1)">›</button><button onclick="S.cal='${m?"week":"month"}';R()">${m?"Тиждень":"Місяць"}</button></div>
<div class="cg">${["Пн","Вт","Ср","Чт","Пт","Сб","Нд"].map(x=>`<div class="wh">${x}</div>`).join("")}</div><div class="cg ${m?"":"wk"}">${days.map(x=>{const k=ymd(x),i=ix[k]||{};return`<div class="cd ${m&&x.getMonth()!=d.getMonth()?"o":""} ${k==T?"t":""}" onclick="nav('day','${k}')">${x.getDate()}<i>${i.p?'<b style="background:var(--pl)"></b>':""}${i.a?'<b style="background:var(--pa)"></b>':""}${i.c?'<b style="background:var(--cr)"></b>':""}</i></div>`}).join("")}</div>
<small class="mut"><span style="color:var(--pl)">●</span> заплановані <span style="color:var(--pa)">●</span> минулі/позначки <span style="color:var(--cr)">●</span> нотатки</small></div>`}
function cm(s){const d=S.d;if(S.cal=="month")d.setMonth(d.getMonth()+s,1);else d.setDate(d.getDate()+7*s);R()}

const idbGet=k=>new Promise(r=>{const q=H.transaction("k").objectStore("k").get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()});

async function load(){try{H=await idb();try{CK=await ckey()}catch(e){CK=null}const d=await idbGet("db");if(d&&d.ct&&CK)return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:d.iv},CK,d.ct)));return d}catch(e){return null}}
function flush(){clearTimeout(tm);if(!H)return;if(!CK){try{H.transaction("k","readwrite").objectStore("k").put(DB,"db")}catch(e){}return}const iv=crypto.getRandomValues(new Uint8Array(12));crypto.subtle.encrypt({name:"AES-GCM",iv},CK,new TextEncoder().encode(JSON.stringify(DB))).then(ct=>{try{H.transaction("k","readwrite").objectStore("k").put({iv,ct},"db")}catch(e){}})}

const U8=s=>new TextEncoder().encode(s),b64b=b=>{let s="";const u=new Uint8Array(b);for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode(...u.subarray(i,i+8192));return btoa(s)};
